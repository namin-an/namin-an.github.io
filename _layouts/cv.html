---
layout: default
---

<!-- Immediate redirect to CV PDF -->
<script>
  window.location.replace("{{ page.cv_pdf | prepend: '/assets/pdf/' | relative_url }}");
</script>

<noscript>
  <meta http-equiv="refresh"
        content="0; url={{ page.cv_pdf | prepend: '/assets/pdf/' | relative_url }}">
</noscript>

<div class="post">

  <header class="post-header">
    <h1 class="post-title">
      {{ page.title }}
      {% if page.cv_pdf %}
        <a href="{{ page.cv_pdf | prepend: '/assets/pdf/' | relative_url }}"
           target="_blank"
           rel="noopener noreferrer"
           class="float-right"
           aria-label="Download CV as PDF">
          <i class="fas fa-file-pdf"></i>
        </a>
      {% endif %}
    </h1>
    {% if page.description %}
      <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>
